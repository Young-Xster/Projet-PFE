<div
  class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-purple-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8"
>
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <div class="flex justify-center mb-6">
      <!-- Option Logo here if any -->
      <div
        class="w-12 h-12 bg-gradient-to-br from-purple-600 to-indigo-600 rounded-xl shadow-lg flex items-center justify-center"
      >
        <svg class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
          />
        </svg>
      </div>
    </div>
    <h2 class="mt-2 text-center text-3xl font-extrabold text-gray-900 tracking-tight">
      Employee Portal
    </h2>
    <p class="mt-2 text-center text-sm text-gray-500 font-medium">
      Submit your leave request easily
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-xl">
    <div
      class="bg-white/80 backdrop-blur-md py-8 px-6 shadow-xl shadow-purple-100/50 sm:rounded-2xl sm:px-10 border border-gray-100"
    >
      <!-- Error Message -->
      <div
        *ngIf="errorMessage()"
        class="mb-6 p-4 rounded-xl bg-red-50 border border-red-100 flex items-center gap-3 text-red-700 text-sm font-medium"
      >
        <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        </svg>
        {{ errorMessage() }}
      </div>

      <!-- Step 1: Verification -->
      <div *ngIf="step() === 1" class="animate-in fade-in slide-in-from-bottom-4 duration-500">
        <div class="mb-6 pb-4 border-b border-gray-100">
          <h3 class="text-xl font-bold text-gray-800">Verification</h3>
          <p class="text-sm text-gray-500 mt-1">Please enter your credentials to continue.</p>
        </div>

        <form (ngSubmit)="verifyEmployee()" class="space-y-5">
          <div>
            <label for="email" class="block text-sm font-semibold text-gray-700 mb-1.5"
              >Email address</label
            >
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
              [ngModel]="email()"
              (ngModelChange)="email.set($event)"
              class="appearance-none block w-full px-4 py-3 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all duration-200 sm:text-sm bg-gray-50 focus:bg-white"
              placeholder="you@company.com"
            />
          </div>

          <div>
            <label for="nationalId" class="block text-sm font-semibold text-gray-700 mb-1.5"
              >National ID</label
            >
            <input
              id="nationalId"
              name="nationalId"
              type="text"
              required
              [ngModel]="nationalId()"
              (ngModelChange)="nationalId.set($event)"
              class="appearance-none block w-full px-4 py-3 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all duration-200 sm:text-sm bg-gray-50 focus:bg-white"
              placeholder="Enter your ID number"
            />
          </div>

          <div class="pt-2">
            <button
              type="submit"
              [disabled]="loading()"
              class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-md text-sm font-bold text-white bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200 hover:shadow-lg hover:-translate-y-0.5"
            >
              <span *ngIf="!loading()" class="flex items-center gap-2">
                Verify Identity
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M14 5l7 7m0 0l-7 7m7-7H3"
                  />
                </svg>
              </span>
              <span *ngIf="loading()" class="flex items-center gap-2">
                <div
                  class="w-4 h-4 rounded-full border-2 border-white/20 border-t-white animate-spin"
                ></div>
                Verifying...
              </span>
            </button>
          </div>
        </form>
      </div>

      <!-- Step 2: Leave Request Form -->
      <div *ngIf="step() === 2" class="animate-in fade-in slide-in-from-bottom-4 duration-500">
        <div class="mb-6 pb-4 border-b border-gray-100 flex items-center justify-between">
          <div>
            <h3 class="text-xl font-bold text-gray-800">New Leave Request</h3>
            <p
              class="text-sm font-medium text-purple-600 bg-purple-50 px-2.5 py-1 rounded-md inline-block mt-2"
            >
              Welcome back, {{ firstName() }}!
            </p>
          </div>
          <button
            type="button"
            (click)="step.set(1)"
            class="text-sm text-gray-500 hover:text-gray-900 font-medium flex items-center gap-1 transition-colors"
          >
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M10 19l-7-7m0 0l7-7m-7 7h18"
              />
            </svg>
            Back
          </button>
        </div>

        <form (ngSubmit)="submitLeaveRequest()" class="space-y-5">
          <div>
            <label for="leaveType" class="block text-sm font-semibold text-gray-700 mb-1.5"
              >Leave Type</label
            >
            <select
              id="leaveType"
              name="leaveType"
              required
              [ngModel]="leaveTypeId()"
              (ngModelChange)="leaveTypeId.set($event)"
              class="block w-full px-4 py-3 text-base border-gray-200 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent sm:text-sm rounded-xl border bg-gray-50 focus:bg-white transition-all duration-200"
            >
              <option [ngValue]="null" disabled>Select a type...</option>
              <option *ngFor="let type of leaveTypes()" [value]="type.id">{{ type.name }}</option>
            </select>
            <p *ngIf="!hasLeaveTypes()" class="mt-2 text-sm text-red-600">
              No leave types are configured for your company yet. Please contact HR.
            </p>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <div>
              <label for="startDate" class="block text-sm font-semibold text-gray-700 mb-1.5"
                >Start Date</label
              >
              <input
                id="startDate"
                name="startDate"
                type="date"
                required
                [ngModel]="startDate()"
                (ngModelChange)="onStartDateChange($event)"
                class="appearance-none block w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent sm:text-sm bg-gray-50 focus:bg-white transition-all duration-200"
              />
            </div>
            <div>
              <label for="endDate" class="block text-sm font-semibold text-gray-700 mb-1.5"
                >End Date</label
              >
              <input
                id="endDate"
                name="endDate"
                type="date"
                required
                [ngModel]="endDate()"
                (ngModelChange)="onEndDateChange($event)"
                class="appearance-none block w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent sm:text-sm bg-gray-50 focus:bg-white transition-all duration-200"
              />
            </div>
          </div>

          <div>
            <label for="totalDays" class="block text-sm font-semibold text-gray-700 mb-1.5"
              >Total Days</label
            >
            <input
              id="totalDays"
              name="totalDays"
              type="number"
              required
              [ngModel]="totalDays()"
              readonly
              min="1"
              class="appearance-none block w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent sm:text-sm bg-gray-50 focus:bg-white transition-all duration-200"
            />
          </div>

          <div>
            <label for="reason" class="block text-sm font-semibold text-gray-700 mb-1.5"
              >Reason</label
            >
            <textarea
              id="reason"
              name="reason"
              rows="3"
              required
              [ngModel]="reason()"
              (ngModelChange)="reason.set($event)"
              class="appearance-none block w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent sm:text-sm bg-gray-50 focus:bg-white transition-all duration-200 resize-none"
              placeholder="Provide a brief reason for your leave..."
            ></textarea>
          </div>

          <div class="pt-2">
            <button
              type="submit"
              [disabled]="loading() || !hasLeaveTypes()"
              class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-md text-sm font-bold text-white bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200 hover:shadow-lg hover:-translate-y-0.5"
            >
              <span *ngIf="!loading()" class="flex items-center gap-2">
                Submit Request
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M5 13l4 4L19 7"
                  />
                </svg>
              </span>
              <span *ngIf="loading()" class="flex items-center gap-2">
                <div
                  class="w-4 h-4 rounded-full border-2 border-white/20 border-t-white animate-spin"
                ></div>
                Submitting...
              </span>
            </button>
          </div>
        </form>
      </div>

      <!-- Step 3: Success -->
      <div *ngIf="step() === 3" class="text-center animate-in zoom-in duration-500 py-6">
        <div
          class="mx-auto flex items-center justify-center h-20 w-20 rounded-full bg-green-50 mb-6 border-8 border-green-100/50"
        >
          <svg
            class="h-10 w-10 text-green-500"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.5"
              d="M5 13l4 4L19 7"
            />
          </svg>
        </div>
        <h3 class="text-2xl font-bold text-gray-900 mb-2">Request Submitted!</h3>
        <p class="mt-2 text-base text-gray-500 max-w-sm mx-auto">{{ successMessage() }}</p>

        <div class="mt-8">
          <button
            type="button"
            (click)="
              step.set(1);
              email.set('');
              nationalId.set('');
              reason.set('');
              leaveTypeId.set(null);
              startDate.set('');
              endDate.set('');
              totalDays.set(0)
            "
            class="inline-flex justify-center items-center py-3 px-6 text-sm font-semibold text-purple-700 bg-purple-50 border border-purple-100 rounded-xl hover:bg-purple-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500 transition-all duration-200"
          >
            Submit Another Request
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
