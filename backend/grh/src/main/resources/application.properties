spring.application.name=grh

# database config
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_Username}
spring.datasource.password=${DATABASE_Password}
spring.datasource.driver-class-name=org.postgresql.Driver

# jpa config
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# flyway config
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Keycloak Configuration
keycloak.realm=work
keycloak.auth-server-url=http://localhost:8080
keycloak.resource=GRH
keycloak.public-client=true
keycloak.bearer-only=true

# OAuth2 Resource Server (JWT validation)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/work
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/work/protocol/openid-connect/certs

#server config
server.port=${SERVER_PORT}

#JWT config
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# OpenAPI/Swagger config
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method