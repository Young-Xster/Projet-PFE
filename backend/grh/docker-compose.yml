services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: grh-postgres
    environment:
      POSTGRES_DB: GRHDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: kameless1925
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - grh-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Spring Boot Application
  grh-app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: grh-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/GRHDb
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: kameless1925
      JWT_SECRET: zx1EsZszdTNaMTD9R19ig+veDflBGyXTNwlO0Q4RRLrl/eYW6MzIIYnRRb2OnEr31GsiKFtX5p7z8K3XSp+qCA==
      JWT_EXPIRATION: 86400000
      SERVER_PORT: 8080
      JPA_SHOW_SQL: false
      JPA_FORMAT_SQL: false
      FLYWAY_ENABLED: true
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - grh-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8080/actuator/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  grh-network:
    driver: bridge
